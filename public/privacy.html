<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting to Privacy Policy</title>
<!--
  The pre-Astro site lived at this flat .html URL, and it is registered in
  Google Play Console and may be linked from installed builds of the app, so it
  can never 404. Hosts that support real redirects use vercel.json instead; this
  file is the fallback for hosts that do not.
-->
<link rel="canonical" href="https://personalprayercounter.online/privacy/">
<meta http-equiv="refresh" content="0; url=/privacy/">
<meta name="robots" content="noindex, follow">
</head>
<body>
<p>This page has moved to <a href="/privacy/">Privacy Policy</a>.</p>
</body>
</html>
